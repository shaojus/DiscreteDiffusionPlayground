defaults:
  - _self_
  - model: md4
  - data: gmm
  - optimizer: adamw

seed: 24
device: ${oc.env:DEVICE,cuda}

run:
  mode: train

checkpoint:
  path: null
  resume: false
  strict_model_load: true
  load_optimizer: true

train:
  steps: 20000
  batch_size: 256
  grad_clip_norm: null
  lr_warmup_steps: 0
  lr_warmup_start_factor: 0.1
  save_path: auto

log:
  every: 100

eval:
  interval: 1000
  n_samples: 20000
  n_metrics_samples: 4000     # subsample for O(n^2) divergence metrics; plot still uses full n_samples
  log_true_distribution: true
  true_n_samples: 5000
  ckpt_path: ckpts/model.pt
  out_json: logs/metrics.json

wandb:
  enabled: true
  project: rem_sweep
  entity: 'shaojus-carnegie-mellon-university'
  group: null
