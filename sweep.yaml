program: playground/train.py
method: grid

metric:
  name: MSE
  goal: minimize

parameters:
  model:
    value: sedd

  model.d_model:
    values: [256, 512]

  model.n_layers:
    values: [4]
  
  data:
    value: checkerboard

  seed:
    values: [24]

  train.steps:
    value: 30000

  eval.interval:
    value: 30000

  wandb.group:
    value: sedd_param_sweep

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
